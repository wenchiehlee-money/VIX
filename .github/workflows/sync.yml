name: Sync VIX Data to Downstream Repos
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'raw_vix_merged.csv'
      - 'current_vix.csv'
      - 'raw_column_definition_VIX.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync to Money Repos
        id: sync_biztrends
        continue-on-error: true  # retried below on failure (e.g. biztrends.TW ref-lock race)
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
          CONFIG_PATH: .github/sync-money.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true

      - name: Wait before retrying biztrends.TW sync
        if: steps.sync_biztrends.outcome == 'failure'
        run: sleep $((45 + RANDOM % 90))

      - name: Sync to Money Repos (retry)
        if: steps.sync_biztrends.outcome == 'failure'
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY }}
          CONFIG_PATH: .github/sync-money.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true
